name: fullstack_smoke
description: Smoke tests for the fullstack agent. Each case generates a complete app and checks structural + functional output.

cases:
  - id: todo_app
    agent: fullstack
    timeout_s: 2400
    prompt: |
      Build a small "Todos" web app. A user can register, log in, then create / list /
      mark-done / delete their own todo items. Each todo has a title (string),
      description (string, optional) and done flag (bool). Backend in FastAPI with JWT
      auth, frontend in React + Vite + Tailwind, persistence in Postgres.
    expect_files:
      - docker-compose.yml
      - backend/app/main.py
      - backend/app/models.py
      - backend/app/routers/auth.py
      - "backend/alembic/versions/*.py"
      - frontend/package.json
      - frontend/src/App.tsx
    functional:
      - name: backend_pytest
        type: pytest
        cwd: backend
        required: true
        timeout_s: 300
      - name: backend_import
        type: python_import
        cwd: backend
        module: app.main
        required: true
        timeout_s: 60
      - name: frontend_build
        type: npm_build
        cwd: frontend
        required: false
        timeout_s: 600

