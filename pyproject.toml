[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-agent-platform"
version = "0.1.0"
description = "Pluggable agent platform: LangGraph agents + sandboxed execution + Streamlit UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph==0.2.60",
    "langchain-core>=0.3,<0.4",
    "streamlit==1.32.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai==0.3.8"]
ollama = ["langchain-ollama==0.2.3"]
google = ["langchain-google-genai==2.0.11"]
aws    = ["langchain-aws==0.2.15"]
anthropic = ["langchain-anthropic==0.3.22"]
all = [
    "langchain-openai==0.3.8",
    "langchain-ollama==0.2.3",
    "langchain-google-genai==2.0.11",
    "langchain-aws==0.2.15",
    "langchain-anthropic==0.3.22",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
genai-cli = "scripts.run_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
